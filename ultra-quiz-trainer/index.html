<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウルトラクイズ特訓</title>
<style>
  :root {
    --bg: #10141c;
    --panel: #1b2230;
    --panel2: #232c3e;
    --text: #e8ecf3;
    --sub: #93a0b4;
    --accent: #f5b942;
    --ok: #3ecf8e;
    --ng: #f26d6d;
    --line: #32405a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; color: var(--accent); letter-spacing: 0.05em; }
  header .sub { font-size: 0.75rem; color: var(--sub); }
  nav { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
  nav button {
    background: var(--panel); color: var(--sub); border: 1px solid var(--line);
    border-radius: 8px 8px 0 0; padding: 8px 18px; font-size: 0.9rem; cursor: pointer;
  }
  nav button.active { background: var(--panel2); color: var(--text); border-bottom-color: var(--panel2); font-weight: bold; }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  .panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 0 10px 10px 10px; padding: 20px; }
  .filters { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.85rem; color: var(--sub); }
  .filters select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .qmeta { font-size: 0.78rem; color: var(--sub); margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge { border: 1px solid var(--line); border-radius: 20px; padding: 1px 10px; }
  .badge.unverified { color: var(--accent); border-color: var(--accent); }
  .badge.verified { color: var(--ok); border-color: var(--ok); }
  .question { font-size: 1.35rem; line-height: 1.7; margin: 18px 0 26px; min-height: 3.4em; }
  .answers { display: flex; gap: 16px; }
  .answers button {
    flex: 1; font-size: 2.2rem; padding: 22px 0; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--line); background: var(--panel); color: var(--text);
  }
  .answers button:hover { border-color: var(--accent); }
  .answers button:disabled { opacity: 0.45; cursor: default; }
  .result { margin-top: 20px; padding: 16px; border-radius: 10px; background: var(--panel); display: none; }
  .result .verdict { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
  .result .verdict.ok { color: var(--ok); }
  .result .verdict.ng { color: var(--ng); }
  .result .explanation { line-height: 1.7; font-size: 0.95rem; }
  .result .note { margin-top: 8px; font-size: 0.78rem; color: var(--sub); }
  .nextbtn {
    margin-top: 16px; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #1a1a1a; border: none; font-weight: bold; display: none;
  }
  .empty { color: var(--sub); padding: 30px 0; text-align: center; line-height: 1.8; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; line-height: 1.5; }
  th { color: var(--sub); font-weight: normal; white-space: nowrap; }
  td.num { text-align: right; white-space: nowrap; }
  .listwrap { overflow-x: auto; }
  .danger { margin-top: 18px; background: none; border: 1px solid var(--ng); color: var(--ng); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 0.8rem; }
  .sessionbar { font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>ウルトラクイズ特訓</h1>
  <span class="sub">第1次予選 (○×) 対策 — 1問ずつ即答・即復習</span>
</header>

<nav id="nav">
  <button data-view="quiz" class="active">○×特訓</button>
  <button data-view="review">間違いノート</button>
  <button data-view="stats">成績</button>
  <button data-view="list">問題一覧</button>
</nav>

<main>
  <!-- ○×特訓 / 間違いノート 共用のクイズ画面 -->
  <section id="view-quiz" class="panel">
    <div class="filters">
      <label>ジャンル
        <select id="genreFilter"><option value="">すべて</option></select>
      </label>
      <label><input type="checkbox" id="verifiedOnly"> 検証済みの問題のみ</label>
      <span id="poolInfo"></span>
    </div>
    <div class="sessionbar" id="sessionBar"></div>
    <div class="qmeta">
      <span id="qGenre" class="badge"></span>
      <span id="qVerified" class="badge"></span>
    </div>
    <div class="question" id="qText"></div>
    <div class="answers">
      <button id="btnO" style="color: var(--ok)">○</button>
      <button id="btnX" style="color: var(--ng)">×</button>
    </div>
    <div class="result" id="result">
      <div class="verdict" id="verdict"></div>
      <div class="explanation" id="explanation"></div>
      <div class="note" id="noteLine"></div>
    </div>
    <button class="nextbtn" id="btnNext">次の問題 →</button>
    <div class="empty" id="quizEmpty" style="display:none"></div>
  </section>

  <!-- 成績 -->
  <section id="view-stats" class="panel" style="display:none">
    <div class="listwrap">
      <table id="statsTable">
        <thead><tr><th>ジャンル</th><th>解答数</th><th>正解数</th><th>正答率</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <button class="danger" id="btnReset">成績をすべてリセット</button>
  </section>

  <!-- 問題一覧 (レビュー用) -->
  <section id="view-list" class="panel" style="display:none">
    <div class="filters">未検証の問題は「一覧でレビュー → questions.js の verified を true に更新」の手順で承認します。</div>
    <div class="listwrap">
      <table id="listTable">
        <thead><tr><th>ID</th><th>ジャンル</th><th>問題</th><th>正解</th><th>解説 / 出典メモ</th><th>検証</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="questions.js"></script>
<script>
(() => {
  "use strict";

  // ---- 永続化 ----
  const STORAGE_KEY = "ultra-quiz-trainer";
  const SCHEMA_VERSION = 1;

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.schemaVersion === SCHEMA_VERSION) return data;
        // 将来スキーマを変えたときはここに移行処理を書く
      }
    } catch (e) { /* 壊れた保存データは捨てて作り直す */ }
    return { schemaVersion: SCHEMA_VERSION, stats: {} };
  }
  function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

  const store = loadStore();

  function recordAnswer(qid, correct) {
    const s = store.stats[qid] || { attempts: 0, correct: 0, lastResult: null, lastAt: null };
    s.attempts += 1;
    if (correct) s.correct += 1;
    s.lastResult = correct;
    s.lastAt = new Date().toISOString();
    store.stats[qid] = s;
    saveStore();
  }

  // ---- 出題プール ----
  const OX = QUESTIONS.filter(q => q.type === "ox");
  let mode = "quiz";           // "quiz" | "review"
  let current = null;
  let session = { asked: 0, correct: 0 };

  function pool() {
    let qs = OX;
    const genre = el.genreFilter.value;
    if (genre) qs = qs.filter(q => q.genre === genre);
    if (el.verifiedOnly.checked) qs = qs.filter(q => q.verified);
    if (mode === "review") {
      qs = qs.filter(q => store.stats[q.id] && store.stats[q.id].lastResult === false);
    }
    return qs;
  }

  function pickNext() {
    const qs = pool();
    if (qs.length === 0) return null;
    // 直前の問題の連続出題を避ける (プールが1問しかない場合を除く)
    const candidates = (qs.length > 1 && current) ? qs.filter(q => q.id !== current.id) : qs;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  // ---- 画面 ----
  const el = {};
  ["nav", "genreFilter", "verifiedOnly", "poolInfo", "sessionBar",
   "qGenre", "qVerified", "qText", "btnO", "btnX",
   "result", "verdict", "explanation", "noteLine", "btnNext", "quizEmpty",
   "statsTable", "listTable", "btnReset"].forEach(id => el[id] = document.getElementById(id));
  const views = {
    quiz: document.getElementById("view-quiz"),
    stats: document.getElementById("view-stats"),
    list: document.getElementById("view-list"),
  };

  function showQuestion() {
    current = pickNext();
    const has = current !== null;
    el.quizEmpty.style.display = has ? "none" : "block";
    document.querySelector(".answers").style.display = has ? "flex" : "none";
    document.querySelector(".qmeta").style.display = has ? "flex" : "none";
    el.qText.style.display = has ? "block" : "none";
    el.result.style.display = "none";
    el.btnNext.style.display = "none";
    el.poolInfo.textContent = `出題対象: ${pool().length}問`;
    el.sessionBar.textContent = session.asked > 0
      ? `このセッション: ${session.asked}問中 ${session.correct}問正解`
      : "";
    if (!has) {
      el.quizEmpty.textContent = (mode === "review")
        ? "間違いノートは空です。直近の解答で間違えた問題がここに出ます。"
        : "条件に合う問題がありません。フィルタを変更してください。";
      return;
    }
    el.qGenre.textContent = current.genre;
    el.qVerified.textContent = current.verified ? "検証済み" : "未検証";
    el.qVerified.className = "badge " + (current.verified ? "verified" : "unverified");
    el.qText.textContent = current.question;
    el.btnO.disabled = false;
    el.btnX.disabled = false;
  }

  function answer(choice) {
    if (!current) return;
    el.btnO.disabled = true;
    el.btnX.disabled = true;
    const correct = (choice === current.answer);
    recordAnswer(current.id, correct);
    session.asked += 1;
    if (correct) session.correct += 1;
    el.verdict.textContent = correct ? "正解!" : `不正解… 正解は「${current.answer ? "○" : "×"}」`;
    el.verdict.className = "verdict " + (correct ? "ok" : "ng");
    el.explanation.textContent = current.explanation;
    el.noteLine.textContent = `出典メモ: ${current.note}` + (current.source_url ? ` / ${current.source_url}` : "");
    el.result.style.display = "block";
    el.btnNext.style.display = "inline-block";
    el.sessionBar.textContent = `このセッション: ${session.asked}問中 ${session.correct}問正解`;
    el.btnNext.focus();
  }

  // ---- 成績 ----
  function renderStats() {
    const byGenre = {};
    for (const q of OX) {
      const s = store.stats[q.id];
      if (!s) continue;
      const g = byGenre[q.genre] || { attempts: 0, correct: 0 };
      g.attempts += s.attempts;
      g.correct += s.correct;
      byGenre[q.genre] = g;
    }
    const tbody = el.statsTable.querySelector("tbody");
    tbody.innerHTML = "";
    const genres = Object.keys(byGenre).sort();
    if (genres.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:var(--sub)">まだ解答がありません。</td></tr>';
      return;
    }
    let ta = 0, tc = 0;
    for (const g of genres) {
      const { attempts, correct } = byGenre[g];
      ta += attempts; tc += correct;
      tbody.insertAdjacentHTML("beforeend",
        `<tr><td>${g}</td><td class="num">${attempts}</td><td class="num">${correct}</td>` +
        `<td class="num">${(100 * correct / attempts).toFixed(1)}%</td></tr>`);
    }
    tbody.insertAdjacentHTML("beforeend",
      `<tr><td><b>合計</b></td><td class="num"><b>${ta}</b></td><td class="num"><b>${tc}</b></td>` +
      `<td class="num"><b>${(100 * tc / ta).toFixed(1)}%</b></td></tr>`);
  }

  // ---- 問題一覧 (レビュー用) ----
  function renderList() {
    const tbody = el.listTable.querySelector("tbody");
    tbody.innerHTML = "";
    for (const q of OX) {
      const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      tbody.insertAdjacentHTML("beforeend",
        `<tr><td>${esc(q.id)}</td><td>${esc(q.genre)}</td><td>${esc(q.question)}</td>` +
        `<td>${q.answer ? "○" : "×"}</td>` +
        `<td>${esc(q.explanation)}<br><span style="color:var(--sub)">${esc(q.note)}${q.source_url ? " / " + esc(q.source_url) : ""}</span></td>` +
        `<td><span class="badge ${q.verified ? "verified" : "unverified"}">${q.verified ? "済" : "未"}</span></td></tr>`);
    }
  }

  // ---- ナビゲーション ----
  el.nav.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    for (const b of el.nav.querySelectorAll("button")) b.classList.toggle("active", b === btn);
    const view = btn.dataset.view;
    mode = (view === "review") ? "review" : "quiz";
    views.quiz.style.display = (view === "quiz" || view === "review") ? "block" : "none";
    views.stats.style.display = (view === "stats") ? "block" : "none";
    views.list.style.display = (view === "list") ? "block" : "none";
    if (view === "stats") renderStats();
    if (view === "list") renderList();
    if (view === "quiz" || view === "review") { session = { asked: 0, correct: 0 }; current = null; showQuestion(); }
  });

  el.btnO.addEventListener("click", () => answer(true));
  el.btnX.addEventListener("click", () => answer(false));
  el.btnNext.addEventListener("click", showQuestion);
  el.genreFilter.addEventListener("change", () => { current = null; showQuestion(); });
  el.verifiedOnly.addEventListener("change", () => { current = null; showQuestion(); });
  el.btnReset.addEventListener("click", () => {
    if (confirm("ジャンル別成績と間違いノートをすべて消去します。よろしいですか?")) {
      store.stats = {};
      saveStore();
      renderStats();
    }
  });
  // キーボード操作: ○=左/o、×=右/x、次へ=Enter/Space
  document.addEventListener("keydown", (e) => {
    if (views.quiz.style.display === "none") return;
    if (el.btnNext.style.display !== "none" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showQuestion(); return; }
    if (el.btnO.disabled) return;
    if (e.key === "ArrowLeft" || e.key === "o") answer(true);
    if (e.key === "ArrowRight" || e.key === "x") answer(false);
  });

  // ---- 初期化 ----
  for (const g of [...new Set(OX.map(q => q.genre))].sort()) {
    el.genreFilter.insertAdjacentHTML("beforeend", `<option value="${g}">${g}</option>`);
  }
  showQuestion();
})();
</script>
</body>
</html>
