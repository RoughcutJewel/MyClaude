<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #canvas {
    flex: 1;
    display: block;
    cursor: crosshair;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #12121a;
    border-top: 1px solid #2a2a3a;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #999;
  }
  input[type=range] {
    width: 80px;
    accent-color: #7f77dd;
  }
  select {
    background: #1e1e2e;
    color: #e8e8f0;
    border: 1px solid #3a3a4a;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13px;
  }
  button {
    background: #1e1e2e;
    color: #e8e8f0;
    border: 1px solid #3a3a4a;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #2e2e4e; }
  button.active { background: #534ab7; border-color: #7f77dd; }
  #hint {
    font-size: 12px;
    color: #555;
    margin-left: auto;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <div class="ctrl-group">
    <label>モード</label>
    <select id="modeSelect">
      <option value="burst">バースト</option>
      <option value="spiral">スパイラル</option>
      <option value="web">ウェブ</option>
      <option value="ripple">リップル</option>
      <option value="galaxy">ギャラクシー</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>密度</label>
    <input type="range" id="densitySlider" min="5" max="60" value="24">
  </div>
  <div class="ctrl-group">
    <label>サイズ</label>
    <input type="range" id="sizeSlider" min="20" max="200" value="80">
  </div>
  <div class="ctrl-group">
    <label>色</label>
    <select id="paletteSelect">
      <option value="aurora">オーロラ</option>
      <option value="sunset">サンセット</option>
      <option value="ocean">オーシャン</option>
      <option value="fire">ファイア</option>
      <option value="mono">モノクロ</option>
    </select>
  </div>
  <button id="trailBtn">軌跡: OFF</button>
  <button id="clearBtn">クリア</button>
  <button id="saveBtn">保存</button>
  <span id="hint">クリック / ドラッグで描く</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let trail = false;

const palettes = {
  aurora:  ['#7f77dd','#1d9e75','#5dcaa5','#afa9ec','#9fe1cb'],
  sunset:  ['#d85a30','#ef9f27','#ed93b1','#f09595','#fac775'],
  ocean:   ['#378add','#1d9e75','#85b7eb','#5dcaa5','#b5d4f4'],
  fire:    ['#e24b4a','#ef9f27','#d85a30','#f7c1c1','#fac775'],
  mono:    ['#ffffff','#cccccc','#999999','#666666','#aaaaaa'],
};

function resize() {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = w;
  canvas.height = h;
  ctx.putImageData(img, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getParams() {
  return {
    mode: document.getElementById('modeSelect').value,
    density: parseInt(document.getElementById('densitySlider').value),
    size: parseInt(document.getElementById('sizeSlider').value),
    palette: palettes[document.getElementById('paletteSelect').value],
  };
}

function drawBurst(x, y, {density, size, palette}) {
  for (let i = 0; i < density; i++) {
    const angle = (Math.PI * 2 / density) * i + rnd(-0.3, 0.3);
    const len = rnd(size * 0.3, size);
    const color = pick(palette);
    const alpha = rnd(0.4, 0.9);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = rnd(0.5, 2.5);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.stroke();
    if (Math.random() > 0.6) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle) * len, y + Math.sin(angle) * len, rnd(1, 4), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawSpiral(x, y, {density, size, palette}) {
  const turns = density / 8;
  const steps = density * 5;
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.strokeStyle = pick(palette);
  ctx.lineWidth = rnd(0.8, 2);
  ctx.beginPath();
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const angle = t * Math.PI * 2 * turns;
    const r = t * size;
    const px = x + Math.cos(angle) * r;
    const py = y + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  for (let i = 0; i < density; i++) {
    const t = i / density;
    const angle = t * Math.PI * 2 * turns;
    const r = t * size;
    ctx.fillStyle = pick(palette);
    ctx.globalAlpha = rnd(0.3, 0.8);
    ctx.beginPath();
    ctx.arc(x + Math.cos(angle) * r, y + Math.sin(angle) * r, rnd(1, 3.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawWeb(x, y, {density, size, palette}) {
  const nodes = [];
  for (let i = 0; i < density; i++) {
    const angle = rnd(0, Math.PI * 2);
    const r = rnd(0, size);
    nodes.push({x: x + Math.cos(angle) * r, y: y + Math.sin(angle) * r, color: pick(palette)});
  }
  ctx.save();
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < size * 0.7) {
        ctx.globalAlpha = (1 - dist / (size * 0.7)) * 0.6;
        ctx.strokeStyle = nodes[i].color;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
  nodes.forEach(n => {
    ctx.fillStyle = n.color;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(n.x, n.y, rnd(1.5, 4), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawRipple(x, y, {density, size, palette}) {
  ctx.save();
  for (let i = density; i > 0; i--) {
    const r = (i / density) * size;
    ctx.globalAlpha = (1 - i / density) * 0.6 + 0.05;
    ctx.strokeStyle = pick(palette);
    ctx.lineWidth = rnd(0.5, 2);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGalaxy(x, y, {density, size, palette}) {
  ctx.save();
  const arms = 3 + Math.floor(Math.random() * 3);
  for (let a = 0; a < arms; a++) {
    const baseAngle = (Math.PI * 2 / arms) * a;
    for (let i = 0; i < density; i++) {
      const t = i / density;
      const angle = baseAngle + t * Math.PI * 3 + rnd(-0.2, 0.2);
      const r = t * size + rnd(-size * 0.08, size * 0.08);
      ctx.fillStyle = pick(palette);
      ctx.globalAlpha = rnd(0.3, 0.9) * (1 - t * 0.4);
      const dotSize = rnd(0.8, 3) * (1 - t * 0.5 + 0.3);
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle) * r, y + Math.sin(angle) * r, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function draw(x, y) {
  const p = getParams();
  if (!trail) {
    ctx.fillStyle = 'rgba(10,10,15,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  switch (p.mode) {
    case 'burst':  drawBurst(x, y, p); break;
    case 'spiral': drawSpiral(x, y, p); break;
    case 'web':    drawWeb(x, y, p); break;
    case 'ripple': drawRipple(x, y, p); break;
    case 'galaxy': drawGalaxy(x, y, p); break;
  }
}

canvas.addEventListener('mousedown', e => { isDrawing = true; draw(e.offsetX, e.offsetY); });
canvas.addEventListener('mousemove', e => { if (isDrawing) draw(e.offsetX, e.offsetY); });
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isDrawing = true;
  const r = canvas.getBoundingClientRect();
  draw(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  draw(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
}, {passive: false});
canvas.addEventListener('touchend', () => isDrawing = false);

document.getElementById('trailBtn').addEventListener('click', function() {
  trail = !trail;
  this.textContent = `軌跡: ${trail ? 'ON' : 'OFF'}`;
  this.classList.toggle('active', trail);
});
document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `generative-art-${Date.now()}.png`;
  a.href = canvas.toDataURL();
  a.click();
});
</script>
</body>
</html>
